project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - quarto/*.qmd
    - references/literature-review.md

author:
  - name: Vagish Hemmige
    affiliations:
      - Albert Einstein College of Medicine
    email: vagish.hemmige@gmail.com

website:
  site-url: https://vagishhemmige.github.io/Cryptococcus-donor-screening-CEA/
  repo-url: https://github.com/VagishHemmige/Cryptococcus-donor-screening-CEA
  repo-branch: master
  repo-actions: [edit, issue]
  title: "Cryptococcus donor screening cost effectiveness analysis"
  

  sidebar:
    style: "docked"
    search: true
    contents:
      - href: index.qmd
        text: Home
      - section: Setup and helper functions
        contents:
          - href: quarto/setup.qmd
            text: Setup and parameters
          - href: quarto/functions.qmd
            text: Functions
      - section: Model code
        contents:
          - href: quarto/base_case_tree.qmd
            text: Base-case tree
          - href: quarto/scenario_trees.qmd
            text: Scenario trees
          - href: quarto/sensitivity_analyses.qmd
            text: Sensitivity analyses
      - section: Results
        contents:
          - href: quarto/results_base_case.qmd
            text: Base case
          - href: quarto/results_scenarios.qmd
            text: Scenario analyses
          - href: quarto/results_tornado.qmd
            text: One-way sensitivity (tornado)
          - href: quarto/results_psa.qmd
            text: Probabilistic sensitivity
      - href: references/literature-review.md
        text: Evidence base for parameters
      - href: quarto/about.qmd
        text: About

  page-navigation: true

bibliography: references.bib

custom-callout:
  Rcode:
    icon: true
    icon-symbol: "💻 "
    color: "pink"

filters:
- custom-callout

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true
    page-layout: full
    code-summary: "Click to show/hide R Code"    
    lightbox: true